name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write        # needed to publish to GitHub Container Registry

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        working-directory: app
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Security scan of Terraform (Checkov)
        run: |
          pip install checkov
          checkov -d terraform --quiet || true   # warn-only while learning

  build-and-push:
    needs: test-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hello-devops:${{ github.sha }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/hello-devops:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"        # warn-only while learning
